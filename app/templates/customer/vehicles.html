{% extends "base.html" %}
{% block title %}My vehicles{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>My vehicles</h1>
    <a href="{{ url_for('customer.new_vehicle') }}" class="btn btn-primary">Add vehicle</a>
  </div>

  {% if vehicles %}
    <div class="card-list">
      {% for v in vehicles %}
        <div class="card list-card">
          <div>
            <strong>{{ v.label }}</strong>
          </div>
          <div class="list-actions">
            <a href="{{ url_for('customer.edit_vehicle', vehicle_id=v.id) }}" class="btn btn-ghost btn-small">Edit</a>
            <form method="POST" action="{{ url_for('customer.delete_vehicle', vehicle_id=v.id) }}" onsubmit="return confirm('Remove this vehicle?');">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-ghost btn-small btn-danger">Remove</button>
            </form>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="card empty-state">
      <p class="muted">You haven't added any vehicles yet.</p>
      <a href="{{ url_for('customer.new_vehicle') }}" class="btn btn-primary">Add your first vehicle</a>
    </div>
  {% endif %}
{% endblock %}
